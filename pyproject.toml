[project]
name = "draftassistant"
version = "0.2.0"
description = "Browser-based live draft assistant for ESPN fantasy basketball"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
draft-assistant = "draft_assistant.server:main"

[tool.setuptools]
packages = ["draft_assistant"]

[tool.setuptools.package-data]
draft_assistant = ["static/*"]
