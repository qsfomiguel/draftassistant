<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Assistant</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #6b7280; --line: #e5e7eb;
  --accent: #2563eb; --accent-soft: #dbeafe; --mine: #fef3c7; --mine-strong: #d97706;
  --good: #15803d; --bad: #b91c1c; --warn: #b45309; --chip: #f1f5f9;
  --pos: 21, 128, 61; --neg: 185, 28, 28;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --panel: #171a21; --text: #e6e8ec; --muted: #9aa3af; --line: #2a2f3a;
    --accent: #60a5fa; --accent-soft: #1e3a5f; --mine: #3a2f12; --mine-strong: #fbbf24;
    --good: #4ade80; --bad: #f87171; --warn: #fbbf24; --chip: #232833;
    --pos: 74, 222, 128; --neg: 248, 113, 113;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 10px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.small { padding: 2px 8px; font-size: 12px; }
button:disabled { opacity: .5; cursor: default; }
input[type=text], input[type=password], input[type=number], select {
  border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 8px; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--panel);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; }
header .meta { color: var(--muted); }
header .spacer { flex: 1; }
.pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--chip); color: var(--muted); }
.pill.live { color: var(--good); }
.pill.err { color: var(--bad); }
main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 16px; padding: 16px 20px; max-width: 1600px; margin: 0 auto; }
@media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.banner { padding: 10px 14px; border-radius: 8px; margin: 12px 20px 0; border: 1px solid var(--line); background: var(--panel); }
.banner.err { border-color: var(--bad); color: var(--bad); }
.banner.warn { border-color: var(--warn); }
.clock { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.clock .big { font-size: 26px; font-weight: 700; }
.clock .sub { color: var(--muted); }
.clock.myturn { background: var(--mine); border-color: var(--mine-strong); }
.clock.myturn .big { color: var(--mine-strong); }
.progress { height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; margin-top: 10px; }
.progress div { height: 100%; background: var(--accent); }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.chips button { border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.chips button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
td.l, th.l { text-align: left; }
th.punted, td.punted { opacity: .35; }
tr.top td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.name { font-weight: 600; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; margin-left: 4px; background: var(--chip); color: var(--muted); font-weight: 500; }
.tag.inj { color: var(--bad); }
.tag.last { color: var(--accent); }
.tag.gone { color: var(--warn); }
.tag.bench { color: #a855f7; }
.z { border-radius: 4px; }
.actions { display: flex; gap: 4px; justify-content: flex-end; }
.roster li, .log li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); list-style: none; }
.roster ul, .log ul { margin: 0; padding: 0; }
.log { max-height: 360px; overflow-y: auto; }
.log li.mine { background: var(--mine); }
.muted { color: var(--muted); }
.cats { display: grid; grid-template-columns: 56px 1fr 44px; gap: 4px 8px; align-items: center; }
.bar { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.bar div { height: 100%; border-radius: 4px; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 20px; width: min(520px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,.4); }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.setup { max-width: 520px; margin: 60px auto; }
.hint { font-size: 12px; color: var(--muted); }
.radar svg { width: 100%; height: auto; display: block; }
.radar .ring { fill: none; stroke: var(--line); }
.radar .ring.band { fill: var(--chip); fill-opacity: .55; }
.radar .spoke { stroke: var(--line); }
.radar .axis { font-size: 11px; font-weight: 600; fill: var(--text); }
.radar .axis.punted { fill: var(--muted); opacity: .5; }
.radar .rk { font-size: 10px; fill: var(--muted); }
.radar .rk.up { fill: var(--good); font-weight: 600; }
.radar .rk.down { fill: var(--bad); font-weight: 600; }
.radar .avg { fill: #f08a6b; fill-opacity: .35; stroke: #e0603b; stroke-width: 1.5; }
.radar .me { fill: #3e64a8; fill-opacity: .45; stroke: #2f4f8a; stroke-width: 2; }
.radar .plus { fill: #22a06b; fill-opacity: .18; stroke: #16a34a; stroke-width: 2; stroke-dasharray: 5 3; }
@media (prefers-color-scheme: dark) {
  .radar .me { fill: #5b8def; stroke: #8fb3ff; }
  .radar .plus { stroke: #4ade80; fill: #4ade80; }
}
.srcs { width: 100%; margin-top: 10px; font-size: 12px; }
.srcs th, .srcs td { padding: 3px 3px; }
.srcs tr.avg td { font-weight: 700; border-top: 2px solid var(--line); }
.srcs td.hi { color: var(--good); }
.srcs td.lo { color: var(--bad); }
.srcs td.split { background: color-mix(in srgb, var(--warn) 18%, transparent); }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--accent); }
th.sorted { color: var(--accent); }
.tag.drop { color: #fff; background: var(--warn); }
.scar { display: grid; grid-template-columns: 44px 1fr auto; gap: 5px 8px; align-items: center; font-size: 12px; }
.scar .cn { font-weight: 600; cursor: pointer; }
.scar .cn:hover { color: var(--accent); }
.scar .what { color: var(--muted); grid-column: 2 / 4; margin-top: -3px; }
.scar .lvl { font-size: 11px; padding: 0 6px; border-radius: 4px; }
.scar .lvl.scarce { background: var(--bad); color: #fff; }
.scar .lvl.drying { background: var(--warn); color: #fff; }
.scar .lvl.ok { background: var(--chip); color: var(--muted); }
.depth { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.depth h3 { font-size: 12px; color: var(--muted); margin: 0 0 4px; }
.depth ol { margin: 0; padding-left: 18px; font-size: 12px; }
.depth li { padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.depth li.start { font-weight: 600; }
.depth li.selp { color: #fff; background: #16a34a; border-radius: 4px; padding: 0 4px; margin-left: -4px; }
.depth li.taken { color: var(--muted); text-decoration: line-through; }
.depth li.mine { color: var(--mine-strong); }
@media (max-width: 700px) { .depth { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.selrow td { background: color-mix(in srgb, #22a06b 14%, transparent) !important; }
.name.sel { cursor: pointer; }
.name.sel:hover { text-decoration: underline; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: .95; }
</style>
</head>
<body>
<header>
  <h1 id="title">Draft Assistant</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <span class="pill" id="status">Loading…</span>
  <button id="settingsBtn">Settings</button>
</header>
<div id="banners"></div>
<div id="root"></div>

<dialog id="settings">
  <h2 style="margin-top:0">Settings</h2>
  <div id="settingsTeam"></div>
  <div id="settingsPunt"></div>
  <div class="field">
    <label for="balance">Lean toward my weakest categories: <span id="balanceVal"></span></label>
    <input type="range" id="balance" min="0" max="1" step="0.05">
  </div>
  <div class="field row"><label><input type="checkbox" id="live"> Follow ESPN picks live</label></div>
  <hr style="border:0;border-top:1px solid var(--line)">
  <h3 style="font-size:14px">ESPN league</h3>
  <form id="leagueForm2"></form>
  <hr style="border:0;border-top:1px solid var(--line)">
  <div class="row">
    <button id="refreshPlayers">Re-download players</button>
    <button id="demo9">Practice: 9-cat demo</button>
    <button id="demoPts">Practice: points demo</button>
    <span class="spacer" style="flex:1"></span>
    <button id="closeSettings" class="primary">Done</button>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = null;            // latest full state
let version = null;
let filter = { pos: "ALL", q: "", hideInjured: false, limit: 40, sort: "score" };  // sort: "score", "adp", "rank" or a category id
let scarOrder = "espn";  // scarcity looks at the next 20 in ESPN's order ("espn") or in my list ("mine")
let wasMyTurn = false;
let selected = null;      // player picked to preview on the team chart
let detail = null;        // that player's projections by source, from /api/player
let depth = null;         // his NBA team's depth chart, from /api/depth

async function api(path, body) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2500);
}
async function act(path, body, okMsg) {
  try { const s = await api(path, body ?? {}); apply(s); if (okMsg) toast(okMsg); return true; }
  catch (e) { toast(e.message); await refresh(true); return false; }
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .18].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.15, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .15);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .16);
    });
  } catch (e) {}
}

function zStyle(z, punted) {
  if (z == null || punted) return "";
  const a = Math.min(Math.abs(z) / 2.5, 1) * 0.45;
  return `background: rgba(var(${z >= 0 ? "--pos" : "--neg"}), ${a.toFixed(2)})`;
}
function ordinal(n) { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function ago(ts) { if (!ts) return ""; const s = Math.round(Date.now() / 1000 - ts); return s < 5 ? "just now" : s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`; }

// ---------- rendering ----------
function render() {
  renderHeader();
  renderBanners();
  const root = $("#root");
  if (!S.league) { root.innerHTML = setupView(); bindLeagueForm($("#leagueForm")); return; }
  const scrollY = window.scrollY;
  const focused = document.activeElement && document.activeElement.id;
  root.innerHTML = `<main>
    <div class="stack">${clockView()}${depthView()}${boardView()}</div>
    <div class="stack">${S.league.is_points ? standingsView() : radarView() + scarcityView()}${rosterView()}${logView()}</div>
  </main>`;
  bindBoard();
  if (focused === "search") { const el = $("#search"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  window.scrollTo(0, scrollY);
}

function renderHeader() {
  const lg = S.league;
  $("#title").textContent = lg ? lg.name : "Draft Assistant";
  $("#meta").textContent = lg ? `${lg.scoring.replace(/_/g, " ").toLowerCase()} · ${lg.num_teams} teams · ${lg.rounds} rounds` : "";
  updateStatus();
  document.title = S.clock && S.clock.my_turn ? "● Your pick! · Draft Assistant" : "Draft Assistant";
}
function updateStatus() {
  const st = $("#status");
  st.className = "pill";
  if (S.mode === "demo") { st.textContent = "Practice league"; return; }
  if (S.mode !== "espn") { st.textContent = "Not connected"; return; }
  if (S.poll_error) { st.className = "pill err"; st.textContent = "ESPN not responding"; st.title = S.poll_error; return; }
  if (!S.config.live) { st.textContent = "Live updates paused"; return; }
  st.className = "pill live"; st.textContent = `● Live · ${ago(S.last_poll)}`; st.title = "";
}

function renderBanners() {
  const b = [];
  if (S.error) b.push(`<div class="banner err">${esc(S.error)}</div>`);
  if (S.poll_error) b.push(`<div class="banner err">Couldn't refresh picks from ESPN: ${esc(S.poll_error)}. Keep drafting; you can enter picks by hand below.</div>`);
  if (S.league && S.my_team_id == null) {
    b.push(`<div class="banner warn row"><b>Which team is yours?</b> ${teamSelect("bannerTeam")} <span class="hint">Needed to track your roster and your picks.</span></div>`);
  }
  for (const src of (S.projections && S.projections.sources) || []) {
    if (src.error) b.push(`<div class="banner warn">${esc(src.label)} projections: ${esc(src.error)}. Rankings use the other sources.</div>`);
  }
  if (S.league && S.mode === "espn" && S.with_stats < 100) b.push(`<div class="banner warn">ESPN only sent stats for ${S.with_stats} players, so rankings may be thin. Try Settings → Re-download players.</div>`);
  if (S.league && !S.league.has_order) b.push(`<div class="banner warn">ESPN hasn't set the draft order yet, so whose turn it is is unknown. It appears once the league manager sets it.</div>`);
  $("#banners").innerHTML = b.join("");
  const sel = $("#bannerTeam"); if (sel) sel.onchange = () => act("/api/settings", { team_id: sel.value }, "Saved your team");
}
function teamSelect(id) {
  const opts = S.league.teams.map(t => `<option value="${t.id}" ${t.id === S.my_team_id ? "selected" : ""}>${esc(t.name)}${t.slot ? ` (pick ${t.slot})` : ""}</option>`).join("");
  return `<select id="${id}"><option value="">Choose…</option>${opts}</select>`;
}

function setupView() {
  return `<div class="setup panel">
    <h2>Connect your ESPN league</h2>
    <form id="leagueForm"></form>
    <p class="hint">No league yet? <button id="demoStart">Try a practice league</button></p>
  </div>`;
}
function leagueFormHtml() {
  const c = S.config;
  return `
    <div class="field"><label>League ID (the number after <code>leagueId=</code> in your league's URL)</label>
      <input type="text" name="league_id" value="${esc(c.league_id ?? "")}" inputmode="numeric" required></div>
    <div class="field"><label>Season (ESPN names it by the year it ends)</label>
      <input type="number" name="season" value="${esc(c.season)}"></div>
    <div class="field"><label>espn_s2 cookie ${c.has_cookies ? "(saved; leave blank to keep)" : "(private leagues)"}</label>
      <input type="password" name="espn_s2" autocomplete="off"></div>
    <div class="field"><label>SWID cookie ${c.has_cookies ? "(saved; leave blank to keep)" : "(private leagues)"}</label>
      <input type="password" name="swid" autocomplete="off" placeholder="{XXXXXXXX-XXXX-...}"></div>
    <p class="hint">To find the cookies: sign in at fantasy.espn.com in Chrome or Safari, open the developer tools,
      go to Application (Chrome) or Storage (Safari) → Cookies → https://fantasy.espn.com, and copy <code>espn_s2</code> and <code>SWID</code>.
      They're saved only in <code>config.json</code> on this computer.</p>
    <div class="row"><button class="primary" type="submit">Connect</button>
      ${c.has_cookies ? `<label class="hint"><input type="checkbox" name="clear_cookies"> forget saved cookies</label>` : ""}</div>`;
}
function bindLeagueForm(form) {
  form.innerHTML = leagueFormHtml();
  form.onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(form);
    const body = Object.fromEntries(fd.entries());
    body.clear_cookies = fd.has("clear_cookies");
    const btn = form.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Connecting…";
    const ok = await act("/api/config", body, "Connected to ESPN");
    btn.disabled = false; btn.textContent = "Connect";
    if (ok) $("#settings").close();
  };
  const demo = $("#demoStart"); if (demo) demo.onclick = () => act("/api/demo", {}, "Practice league loaded");
}

function clockView() {
  const c = S.clock;
  if (!c.current) return `<div class="panel clock"><div class="big">Draft complete</div></div>`;
  const pct = Math.round(((c.current - 1) / c.total) * 100);
  const who = c.my_turn ? "You're on the clock" : c.on_clock ? `On the clock: ${esc(c.on_clock)}` : "";
  let next = "";
  if (c.my_turn) next = c.next_after && c.next_after !== c.current ? `After this, your next pick is #${c.next_after}` : "Your last pick";
  else if (c.next_pick) next = `Your next pick: #${c.next_pick} · ${c.picks_away} pick${c.picks_away === 1 ? "" : "s"} away`;
  const espn = S.mode === "espn" ? `<span class="pill">ESPN draft ${c.espn}</span>` : "";
  return `<div class="panel ${c.my_turn ? "clock myturn" : ""}">
    <div class="clock">
      <div><div class="big">Pick ${c.current}</div><div class="sub">Round ${c.round} of ${S.league.rounds}</div></div>
      <div><div class="big" style="font-size:20px">${who}</div><div class="sub">${next}</div></div>
      <span class="spacer" style="flex:1"></span>${espn}
    </div>
    <div class="progress"><div style="width:${pct}%"></div></div>
  </div>`;
}

function statCols() {
  const lg = S.league;
  if (lg.is_points) return [{ key: "fpg", name: "FP/G" }, { key: "gp", name: "GP" }];
  return lg.categories.map(c => ({ key: String(c.id), name: c.name, cat: true, punted: c.punted }));
}
function filtered() {
  const q = filter.q.trim().toLowerCase();
  const rows = S.suggestions.filter(p =>
    (filter.pos === "ALL" || p.pos.includes(filter.pos)) &&
    (!filter.hideInjured || !p.injury) &&
    (!q || p.name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").includes(q)));
  const k = filter.sort;
  if (k === "adp") return rows.slice().sort((a, b) => (a.adp ?? 999) - (b.adp ?? 999));
  if (k === "rank") return rows.slice().sort((a, b) => (a.rank ?? 9999) - (b.rank ?? 9999));
  if (k !== "score") return rows.slice().sort((a, b) => (b.cats[k] ?? b[k] ?? -99) - (a.cats[k] ?? a[k] ?? -99));
  return rows;
}
// My lowest-ranked category on the team chart (ignoring punts), to sort the list by.
function weakestCat() {
  const lg = S.league;
  if (lg.is_points || !S.roster.length) return null;
  const mine = (S.team_totals || {})[String(S.my_team_id)] || {};
  const cats = lg.categories.filter(c => !c.punted && S.standings[String(c.id)]);
  cats.sort((a, b) => S.standings[String(b.id)].rank - S.standings[String(a.id)].rank || (mine[String(a.id)] || 0) - (mine[String(b.id)] || 0));
  return cats[0] || null;
}
// Positions where the best available player is clearly better than the best one you can expect
// at your next pick (the first at that position ADP doesn't flag as "gone soon").
// Returns player id -> {pos, next, gap}.
function dropOffs() {
  const out = {};
  for (const pos of ["PG", "SG", "SF", "PF", "C"]) {
    const list = S.suggestions.filter(p => p.pos.includes(pos)).sort((a, b) => b.value - a.value);
    const top = list[0], next = list.slice(1).find(p => p.lasts !== false);
    if (!top || !next || top.value <= 0 || out[top.id]) continue;
    const gap = top.value - next.value;
    if (gap >= Math.max(1.5, 0.3 * top.value)) out[top.id] = { pos, next, gap };
  }
  return out;
}
// For each category: how many of the next 20 players on the list are good at it (z >= +0.5),
// and how many in the 20 after that, to spot categories that are about to dry up.
function scarcityView() {
  const lg = S.league;
  if (lg.is_points) return "";
  const GOOD = 0.5;
  // ESPN's order is what most other teams see (and what autodraft uses), so it predicts who goes next.
  const board = scarOrder === "espn" ? S.suggestions.slice().sort((a, b) => (a.rank ?? 9999) - (b.rank ?? 9999)) : S.suggestions;
  const rows = lg.categories.map(c => {
    const id = String(c.id);
    const now = board.slice(0, 20), later = board.slice(20, 40);
    const good = now.filter(p => (p.cats[id] ?? 0) >= GOOD).length;
    const goodLater = later.filter(p => (p.cats[id] ?? 0) >= GOOD).length;
    const best = board.slice().sort((a, b) => (b.cats[id] ?? -99) - (a.cats[id] ?? -99))[0];
    return { c, id, good, goodLater, best };
  });
  // Every category gets thinner further down the list, so "drying up" means thinning
  // noticeably faster than the typical category does.
  const ratios = rows.filter(r => !r.c.punted).map(r => r.goodLater / Math.max(r.good, 1)).sort((a, b) => a - b);
  const typical = ratios.length ? ratios[Math.floor(ratios.length / 2)] : 1;
  for (const r of rows) {
    const ratio = r.goodLater / Math.max(r.good, 1);
    r.lvl = r.c.punted ? ["ok", "punted"] : r.good <= 3 ? ["scarce", "scarce"]
      : ratio < 0.6 * typical ? ["drying", "drying up"] : r.good <= 6 ? ["drying", "thin"] : ["ok", "plenty"];
  }
  const order = { scarce: 0, drying: 1, ok: 2 };
  rows.sort((a, b) => (a.c.punted - b.c.punted) || order[a.lvl[0]] - order[b.lvl[0]] || a.good - b.good);
  const html = rows.map(r => `<span class="cn ${r.c.punted ? "muted" : ""}" data-sortcat="${r.id}" title="Sort the list by ${esc(r.c.name)}">${esc(r.c.name)}</span>
    <div class="bar" title="${r.good} of the next 20 are good at ${esc(r.c.name)}"><div style="width:${r.good / 20 * 100}%;background:${r.lvl[0] === "scarce" ? "var(--bad)" : r.lvl[0] === "drying" ? "var(--warn)" : "var(--good)"}"></div></div>
    <span class="lvl ${r.lvl[0]}">${r.lvl[1]}</span>
    <span class="what">${r.good}/20 good now · ${r.goodLater}/20 in the 20 after${r.best ? ` · best: ${esc(r.best.name)} ${(r.best.cats[r.id] > 0 ? "+" : "")}${(r.best.cats[r.id] ?? 0).toFixed(1)}` : ""}</span>`).join("");
  const tog = `<span class="chips" style="float:right;margin-top:-4px">${[["espn", "ESPN order"], ["mine", "My list"]].map(([k, l]) =>
    `<button class="${scarOrder === k ? "on" : ""}" data-scar="${k}">${l}</button>`).join("")}</span>`;
  return `<div class="panel"><h2>${tog}Category scarcity · next 20 ${scarOrder === "espn" ? "in ESPN's order" : "on my list"}</h2><div class="scar">${html}</div>
    <p class="hint">"Good" means at least +0.5 in that category. <b>Scarce</b>: 3 or fewer good players left in the next 20, so grab one soon if you need it. <b>Thin</b>: only 4–6. <b>Drying up</b>: thinning out faster further down the list than the other categories. Click a category to sort the list by it.</p></div>`;
}

// Depth chart of the selected player's NBA team: starters in bold, him highlighted,

async function loadDetail(id) {

// Each source's projection for the selected player. Cells are green/red for the highest/lowest
// source and amber when the sources disagree by more than 15%, a sign the projection is shaky.
function sourcesView() {
  if (!selected || !detail || detail.id !== selected.id) return selected ? `<p class="hint">Loading projections…</p>` : "";
  const ids = detail.stat_ids, rows = detail.rows;
  const pct = id => ["19", "20", "21"].includes(id);
  const fmt = (v, id) => v == null ? "–" : pct(id) ? v.toFixed(3).replace(/^0/, "") : v.toFixed(1);
  const srcRows = rows.filter(r => !r.average);
  const cell = (r, key, v, txt) => {
    if (r.average || srcRows.length < 2 || v == null) return `<td>${txt}</td>`;
    const vals = srcRows.map(x => key === "gp" ? x.gp : x.stats[key]).filter(x => x != null);
    const hi = Math.max(...vals), lo = Math.min(...vals), mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    const split = mean && (hi - lo) / Math.abs(mean) > (key === "gp" || pct(key) ? 0.08 : 0.15);
    const cls = [vals.length > 1 && v === hi ? "hi" : vals.length > 1 && v === lo ? "lo" : "", split ? "split" : ""].join(" ");
    return `<td class="${cls}">${txt}</td>`;
  };
  const head = `<tr><th class="l">Source</th><th>GP</th>${ids.map(id => `<th>${esc(detail.names[id])}</th>`).join("")}</tr>`;
  const body = rows.map(r => `<tr class="${r.average ? "avg" : ""}"><td class="l">${esc(r.source.replace(" Basketball", ""))}</td>${cell(r, "gp", r.gp, r.gp ?? "–")}${
    ids.map(id => cell(r, id, r.stats[id], fmt(r.stats[id], id))).join("")}</tr>`).join("");
  return `<div class="tablewrap"><table class="srcs">${head}${body}</table></div>
    <p class="hint">Per-game projections by source${srcRows.length > 1 ? "; amber = sources disagree" : ""}. The bold row is what the rankings use.</p>`;
}
// Team strength radar: each axis runs from the weakest team (centre) to the strongest (edge) in
// that category right now, so the shape shows where you stand against the league, not raw totals.
function radarView() {
  const lg = S.league, me = S.my_team_id, totals = S.team_totals || {};
  const cats = lg.categories;
  const mine = totals[String(me)];
  if (!cats.length || !mine) return "";
  const others = Object.entries(totals).filter(([tid]) => +tid !== me).map(([, t]) => t);
  const all = Object.values(totals);
  const sel = selected;
  const val = (t, c) => t[String(c.id)] || 0;
  const withSel = c => val(mine, c) + (sel ? (sel.cats[String(c.id)] || 0) : 0);
  const avg = c => all.reduce((s, t) => s + val(t, c), 0) / all.length;
  const rankOf = (v, c) => 1 + others.filter(t => val(t, c) > v + 1e-9).length;
  const n = lg.num_teams;

  const size = 380, cx = size / 2, cy = size / 2 + 4, R = 128, inner = 0.12;
  const scale = cats.map(c => {
    const vals = all.map(t => val(t, c)).concat(sel ? [withSel(c)] : []);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (hi - lo < 1e-6) { lo -= 1; hi += 1; }  // nothing drafted yet: put everyone mid-way
    return v => inner + (1 - inner) * (v - lo) / (hi - lo);
  });
  const ang = i => -Math.PI / 2 + (2 * Math.PI * i) / cats.length;
  const pt = (i, f) => [cx + Math.cos(ang(i)) * R * f, cy + Math.sin(ang(i)) * R * f];
  const poly = (fn, cls) => `<polygon class="${cls}" points="${cats.map((c, i) => pt(i, scale[i](fn(c))).map(x => x.toFixed(1)).join(",")).join(" ")}"/>`;

  const rings = [1, .78, .56, .34, inner].map((f, k) =>
    `<polygon class="ring ${k % 2 ? "" : "band"}" points="${cats.map((c, i) => pt(i, f).join(",")).join(" ")}"/>`).join("");
  const spokes = cats.map((c, i) => { const [x, y] = pt(i, 1); return `<line class="spoke" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/>`; }).join("");
  const labels = cats.map((c, i) => {
    const [x, y] = pt(i, 1.2);
    const anchor = Math.abs(x - cx) < 8 ? "middle" : x > cx ? "start" : "end";
    const r0 = rankOf(val(mine, c), c);
    let rk = `${ordinal(r0)} of ${n}`, cls = "rk";
    if (sel) { const r1 = rankOf(withSel(c), c); if (r1 !== r0) { rk += ` → ${ordinal(r1)}`; cls += r1 < r0 ? " up" : " down"; } }
    return `<text class="axis ${c.punted ? "punted" : ""}" x="${x}" y="${y - 2}" text-anchor="${anchor}">${esc(c.name)}</text>
      <text class="${cls}" x="${x}" y="${y + 11}" text-anchor="${anchor}">${rk}</text>`;
  }).join("");

  const empty = !S.roster.length && !sel;
  const title = sel ? `Your team + ${esc(sel.name)}` : "Your team vs the league";
  return `<div class="panel radar"><h2>${title}</h2>
    <svg viewBox="0 0 ${size} ${size + 8}" role="img" aria-label="Team strength by category">
      ${rings}${spokes}${poly(avg, "avg")}${poly(c => val(mine, c), "me")}${sel ? poly(withSel, "plus") : ""}${labels}
    </svg>
    <div class="legend"><span><i style="background:#3e64a8"></i>Your team</span><span><i style="background:#f08a6b"></i>League average</span>
      ${sel ? `<span><i style="border:2px dashed #16a34a"></i>With ${esc(sel.name)}</span> <button class="small" id="clearSel">Clear</button>` : ""}</div>
    ${sourcesView()}
    <p class="hint">Each spoke runs from the weakest team in that category (centre) to the strongest (edge), based on everyone's picks so far.
      ${empty ? "Click a player's name in the list to see what he would add." : sel ? "Ranks show where you'd move if you drafted him." : "Click a player's name to preview him."}</p></div>`;
}
function standingsView() {
  const st = S.standings, lg = S.league;
  if (!S.roster.length || !Object.keys(st).length) return "";
  const n = lg.num_teams;
  const color = rank => rank <= Math.ceil(n / 3) ? "var(--good)" : rank > n - Math.ceil(n / 3) ? "var(--bad)" : "var(--warn)";
  let rows;
  if (lg.is_points) {
    const s = st.fpg;
    rows = `<span>FP/G</span><div class="bar"><div style="width:${((n - s.rank + 1) / n) * 100}%;background:${color(s.rank)}"></div></div><span>${ordinal(s.rank)}</span>`;
  } else {
    rows = lg.categories.map(c => {
      const s = st[String(c.id)]; if (!s) return "";
      return `<span class="${c.punted ? "punted muted" : ""}">${esc(c.name)}</span>
        <div class="bar"><div style="width:${((n - s.rank + 1) / n) * 100}%;background:${c.punted ? "var(--muted)" : color(s.rank)}"></div></div>
        <span class="muted">${ordinal(s.rank)}</span>`;
    }).join("");
  }
  return `<div class="panel"><h2>Where you rank so far</h2><div class="cats">${rows}</div>
    <p class="hint">Your drafted players' category totals compared with every other team's.</p></div>`;
}
function logView() {

function bindBoard() {
  const s = $("#search");
  s.oninput = () => { filter.q = s.value; filter.limit = 40; render(); };
  document.querySelectorAll("[data-pos]").forEach(b => b.onclick = () => { filter.pos = b.dataset.pos; filter.limit = 40; render(); });
  $("#hideInj").onchange = e => { filter.hideInjured = e.target.checked; render(); };
  document.querySelectorAll("[data-mine]").forEach(b => b.onclick = () => pick(+b.dataset.mine, true));
  document.querySelectorAll("[data-sel]").forEach(el => el.onclick = () => {
    const id = +el.dataset.sel;
    selected = selected && selected.id === id ? null : S.suggestions.find(p => p.id === id) || null;
    render();
    if (selected) { loadDetail(selected.id); loadDepth(selected.id); }
    if (selected && window.innerWidth <= 1000) { const r = $(".radar"); if (r) r.scrollIntoView({ behavior: "smooth" }); }
  });
  document.querySelectorAll("[data-sort]").forEach(th => th.onclick = () => {
    filter.sort = filter.sort === th.dataset.sort && th.dataset.sort !== "score" ? "score" : th.dataset.sort; filter.limit = 40; render();
  });
  document.querySelectorAll("[data-sortcat]").forEach(el => el.onclick = () => {
    filter.sort = el.dataset.sortcat; filter.limit = 40; render(); window.scrollTo({ top: 0, behavior: "smooth" });
  });
  const wk = $("#weakest"); if (wk) wk.onclick = () => { const w = weakestCat(); filter.sort = filter.sort === String(w.id) ? "score" : String(w.id); filter.limit = 40; render(); };
  document.querySelectorAll("[data-scar]").forEach(b => b.onclick = () => { scarOrder = b.dataset.scar; render(); });
  const rs = $("#resetSort"); if (rs) rs.onclick = () => { filter.sort = "score"; render(); };
  const clr = $("#clearSel"); if (clr) clr.onclick = () => { selected = detail = depth = null; render(); };
  const clr2 = $("#clearSel2"); if (clr2) clr2.onclick = () => { selected = detail = depth = null; render(); };
  document.querySelectorAll("[data-taken]").forEach(b => b.onclick = () => pick(+b.dataset.taken, false));
  const more = $("#more"); if (more) more.onclick = () => { filter.limit += 60; render(); };
  $("#undo").onclick = () => act("/api/undo", {}, "Undone");
  $("#auto").onclick = () => act("/api/auto", {}, "Other teams picked up to your turn");
}

// ---------- polling ----------
function apply(s) {
  if (s.unchanged) { if (S) { S.last_poll = s.last_poll; S.poll_error = s.poll_error; updateStatus(); } return; }
  S = s; version = s.version;
  // Drop the preview once he's off the board (drafted by anyone).
  if (selected && !(S.suggestions || []).some(p => p.id === selected.id)) selected = detail = depth = null;
  const myTurn = !!(S.clock && S.clock.my_turn);
  if (myTurn && !wasMyTurn) beep();
  wasMyTurn = myTurn;
  render();
}
async function refresh(force) {
  try { apply(await api(`/api/state${force || version == null ? "" : "?v=" + version}`)); }
  catch (e) { $("#status").className = "pill err"; $("#status").textContent = "App not running"; }
}
refresh(true);
setInterval(refresh, 1500);
</script>
